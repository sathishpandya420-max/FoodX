<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoodX - My Orders</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="food.css">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar bg-white shadow-sm">
        <div class="container">

            <a class="navbar-brand fw-bold text-danger fs-3" href="food.html">
                <i class="bi bi-egg-fried"></i> FoodX
            </a>

            <a href="food.html" class="btn btn-outline-danger">
                <i class="bi bi-house"></i> Home
            </a>

        </div>
    </nav>


    <!-- My Orders -->
    <div class="container py-5">

        <h2 class="fw-bold mb-4">
            <i class="bi bi-bag-check text-danger"></i>
            My Orders
        </h2>

        <div id="ordersContainer"></div>

    </div>


    <script>

        const orders =
            JSON.parse(localStorage.getItem("foodOrders")) || [];

        const container =
            document.getElementById("ordersContainer");


        if (orders.length === 0) {

            container.innerHTML = `
                <div class="card shadow-sm border-0 p-5 text-center">

                    <i class="bi bi-bag-x text-danger fs-1"></i>

                    <h4 class="mt-3">
                        No Orders Yet
                    </h4>

                    <p class="text-secondary">
                        Your placed orders will appear here.
                    </p>

                    <a href="food.html"
                       class="btn btn-danger">
                        Start Ordering
                    </a>

                </div>
            `;

        } else {

            orders.reverse();

            orders.forEach(order => {

                let itemsHTML = "";

                order.items.forEach(item => {

                    itemsHTML += `
                        <div class="d-flex justify-content-between mb-2">

                            <span>
                                ${item.name}
                                × ${item.quantity}
                            </span>

                            <strong>
                                ₹${item.price * item.quantity}
                            </strong>

                        </div>
                    `;

                });


                let total = 0;

                order.items.forEach(item => {
                    total += item.price * item.quantity;
                });


                container.innerHTML += `

                    <div class="card shadow-sm border-0 mb-4">

                        <div class="card-body">

                            <div class="d-flex justify-content-between">

                                <div>
                                    <h5 class="fw-bold">
                                        Order #${order.orderId}
                                    </h5>

                                    <small class="text-secondary">
                                        ${order.date}
                                    </small>
                                </div>

                               <div>
    <span class="badge bg-success">
        ${order.status}
    </span>
    <div class="small text-secondary mt-2">
        Order Placed → Preparing → Out for Delivery → Delivered
    </div>
</div>
                            </div>
<div class="mt-3">

    <small class="fw-bold">Order Progress</small>

    <div class="progress mt-2" style="height: 8px;">
        <div class="progress-bar bg-success"
             style="width: ${getProgress(order.status)}%;">
        </div>
    </div>

</div>
                            <hr>

                            ${itemsHTML}

                            <hr>

                            <div class="d-flex justify-content-between">

                                <strong>Total</strong>

                                <strong class="text-danger">
                                    ₹${total}
                                </strong>

                            </div>
<button class="btn btn-outline-danger w-100 mt-3"
        onclick="viewOrderDetails('${order.orderId}')">
        <button class="btn btn-outline-secondary w-100 mt-2"
        onclick="cancelOrder('${order.orderId}')">
    <i class="bi bi-x-circle"></i>
    Cancel Order
</button>
    <i class="bi bi-eye"></i>
    View Details
</button>
                           <div class="mt-3">

    <small class="text-secondary">
        <i class="bi bi-person"></i>
        ${order.customerName}
    </small>

    <br>

    <small class="text-secondary">
        <i class="bi bi-telephone"></i>
        ${order.customerPhone}
    </small>

    <br>

    <small class="text-secondary">
        <i class="bi bi-geo-alt"></i>
        ${order.customerAddress}
    </small>

</div>

</div>
</div>
`;

            });

        }
        function viewOrderDetails(orderId) {

            const orders =
                JSON.parse(localStorage.getItem("foodOrders")) || [];

            const order =
                orders.find(o => o.orderId === orderId);

            if (!order) {
                alert("Order not found!");
                return;
            }

            let details = "";

            order.items.forEach(item => {
                details +=
                    item.name +
                    " × " +
                    item.quantity +
                    " = ₹" +
                    (item.price * item.quantity) +
                    "\n";
            });

            alert(
                "ORDER DETAILS\n\n" +
                "Order ID: " + order.orderId +
                "\nDate: " + order.date +
                "\nStatus: " + order.status +
                "\n\nITEMS:\n" + details +
                "\nCustomer: " + order.customerName +
                "\nPhone: " + order.customerPhone +
                "\nAddress: " + order.customerAddress
            );
        }
        function cancelOrder(orderId) {

            const orders =
                JSON.parse(localStorage.getItem("foodOrders")) || [];

            const order =
                orders.find(o => o.orderId === orderId);

            if (!order) {
                alert("Order not found!");
                return;
            }

            if (order.status === "Cancelled") {
                alert("Order is already cancelled.");
                return;
            }

            if (confirm("Are you sure you want to cancel this order?")) {

                order.status = "Cancelled";

                localStorage.setItem(
                    "foodOrders",
                    JSON.stringify(orders)
                );

                location.reload();
            }
        }
        function getProgress(status) {

            if (status === "Order Placed") {
                return 25;
            }

            if (status === "Preparing") {
                return 50;
            }

            if (status === "Out for Delivery") {
                return 75;
            }

            if (status === "Delivered") {
                return 100;
            }

            if (status === "Cancelled") {
                return 0;
            }

            return 25;
        }
    </script>

</body>

</html>
