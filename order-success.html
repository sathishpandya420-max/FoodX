<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoodX - Order Confirmed</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>


<body class="bg-light">


    <!-- NAVBAR -->

    <nav class="navbar bg-white shadow-sm">

        <div class="container">

            <a class="navbar-brand fw-bold text-danger fs-3" href="food.html">

                <i class="bi bi-egg-fried"></i>
                FoodX

            </a>

        </div>

    </nav>



    <!-- SUCCESS -->

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-7 col-lg-6">

                <div class="card border-0 shadow-sm text-center p-5">


                    <!-- SUCCESS ICON -->

                    <div class="text-success" style="font-size: 70px;">

                        <i class="bi bi-check-circle-fill"></i>

                    </div>


                    <h1 class="fw-bold mt-3">

                        Order Confirmed!

                    </h1>


                    <p class="text-secondary">

                        Thank you for ordering with FoodX 🎉

                    </p>



                    <!-- ORDER ID -->

                    <div class="bg-light rounded p-3 mt-4">

                        <small class="text-secondary">
                            Order ID
                        </small>

                        <h4 id="orderId" class="fw-bold text-danger mb-0">

                        </h4>

                    </div>



                    <!-- CUSTOMER -->

                    <div class="text-start mt-4">

                        <h5 class="fw-bold">
                            Delivery Details
                        </h5>

                        <p class="mb-2">

                            <i class="bi bi-person-fill text-danger"></i>

                            <span id="customerName">
                            </span>

                        </p>


                        <p class="mb-2">

                            <i class="bi bi-telephone-fill text-danger"></i>

                            <span id="customerPhone">
                            </span>

                        </p>


                        <p>

                            <i class="bi bi-geo-alt-fill text-danger"></i>

                            <span id="customerAddress">
                            </span>

                        </p>

                    </div>



                    <!-- DELIVERY -->

                    <div class="alert alert-success mt-4">

                        <i class="bi bi-truck"></i>

                        <strong>
                            Estimated Delivery
                        </strong>

                        <br>

                        30–40 minutes

                    </div>



                    <!-- STATUS -->

                    <div class="text-start mt-4">

                        <h5 class="fw-bold">
                            Order Status
                        </h5>


                        <div class="d-flex align-items-center mb-3">

                            <i class="bi bi-check-circle-fill text-success fs-4 me-3"></i>

                            <span>
                                Order Placed
                            </span>

                        </div>


                        <div class="d-flex align-items-center mb-3">

                            <i class="bi bi-circle text-secondary fs-4 me-3"></i>

                            <span>
                                Preparing Food
                            </span>

                        </div>


                        <div class="d-flex align-items-center mb-3">

                            <i class="bi bi-circle text-secondary fs-4 me-3"></i>

                            <span>
                                Out for Delivery
                            </span>

                        </div>


                        <div class="d-flex align-items-center">

                            <i class="bi bi-circle text-secondary fs-4 me-3"></i>

                            <span>
                                Delivered
                            </span>

                        </div>

                    </div>



                    <!-- BUTTON -->

                    <button class="btn btn-danger w-100 mt-4" onclick="goHome()">

                        <i class="bi bi-house-fill"></i>

                        Continue Ordering

                    </button>


                </div>

            </div>

        </div>

    </div>



    <script>


        // Generate Order ID

        let orderId =
            localStorage.getItem("orderId");


        if (!orderId) {

            orderId =
                "FX" +
                Math.floor(
                    100000 +
                    Math.random() * 900000
                );

            localStorage.setItem(
                "orderId",
                orderId
            );

        }



        // Display Order ID

        document.getElementById("orderId")
            .innerText = orderId;



        // Customer Details

        document.getElementById("customerName")
            .innerText =
            localStorage.getItem("customerName")
            || "Customer";


        document.getElementById("customerPhone")
            .innerText =
            localStorage.getItem("customerPhone")
            || "Not provided";


        document.getElementById("customerAddress")
            .innerText =
            localStorage.getItem("customerAddress")
            || "Not provided";



        // Go Home

        function goHome() {

            window.location.href =
                "food.html";

        }


    </script>


</body>

</html>
