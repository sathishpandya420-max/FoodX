<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoodX - Checkout</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="food.css">
</head>
<script>
    function placeOrder() {

        const name =
            document.getElementById("name").value;

        const phone =
            document.getElementById("phone").value;

        const address =
            document.getElementById("address").value;


        if (
            name === "" ||
            phone === "" ||
            address === ""
        ) {

            alert("Please fill all delivery details.");

            return;
        }


        // Get cart items

        const cart =
            JSON.parse(
                localStorage.getItem("foodCart")
            ) || [];


        if (cart.length === 0) {

            alert("Your cart is empty!");

            return;
        }


        // Create order

        const order = {

            orderId:
                "FX" + Date.now(),

            date:
                new Date().toLocaleString(),

            customerName:
                name,

            customerPhone:
                phone,

            customerAddress:
                address,

            items:
                cart,

            status:
                "Order Placed"

        };


        // Get previous orders

        const orders =
            JSON.parse(
                localStorage.getItem("foodOrders")
            ) || [];


        // Save new order

        orders.push(order);

        localStorage.setItem("foodOrders", JSON.stringify(orders));

        // Save customer details

        localStorage.setItem(
            "customerName",
            name
        );

        localStorage.setItem(
            "customerPhone",
            phone
        );

        localStorage.setItem(
            "customerAddress",
            address
        );


        // Clear cart

        localStorage.removeItem("foodCart");


        // Go to success page

        window.location.href =
            "order-success.html";
    }
</script>

<body class="bg-light">

    <nav class="navbar bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-danger fs-3" href="food.html">
                <i class="bi bi-egg-fried"></i> FoodX
            </a>
        </div>
    </nav>

    <div class="container py-5">

        <h2 class="fw-bold mb-4">
            <i class="bi bi-bag-check text-danger"></i>
            Checkout
        </h2>

        <div class="row g-4">

            <!-- DELIVERY DETAILS -->

            <div class="col-lg-7">

                <div class="card shadow-sm border-0 p-4">

                    <h4 class="fw-bold mb-4">
                        Delivery Details
                    </h4>

                    <label class="form-label">Full Name</label>

                    <input type="text" id="name" class="form-control mb-3" placeholder="Enter your name">

                    <label class="form-label">Phone Number</label>

                    <input type="tel" id="phone" class="form-control mb-3" placeholder="Enter phone number">

                    <label class="form-label">Delivery Address</label>

                    <textarea id="address" class="form-control mb-3" rows="4"
                        placeholder="Enter your delivery address"></textarea>

                    <h5 class="fw-bold mt-4 mb-3">
                        Payment Method
                    </h5>

                    <div class="form-check mb-2">

                        <input class="form-check-input" type="radio" name="payment" value="Cash on Delivery" checked>

                        <label class="form-check-label">
                            Cash on Delivery
                        </label>

                    </div>

                    <div class="form-check">

                        <input class="form-check-input" type="radio" name="payment" value="UPI">

                        <label class="form-check-label">
                            UPI
                        </label>

                    </div>

                </div>

            </div>


            <!-- ORDER SUMMARY -->

            <div class="col-lg-5">

                <div class="card shadow-sm border-0 p-4">

                    <h4 class="fw-bold mb-4">
                        Order Summary
                    </h4>

                    <div id="checkoutItems">
                        Loading cart...
                    </div>

                    <hr>

                    <div class="d-flex justify-content-between">

                        <strong>Total</strong>

                        <strong id="checkoutTotal" class="text-danger">
                            ₹0
                        </strong>

                    </div>

                    <button class="btn btn-danger w-100 mt-4" onclick="placeOrder()">

                        <i class="bi bi-check-circle"></i>
                        Place Order

                    </button>

                </div>

            </div>

        </div>

    </div>


    <script>

        const cart =
            JSON.parse(localStorage.getItem("foodCart")) || [];

        let total = 0;

        const itemsContainer =
            document.getElementById("checkoutItems");


        if (cart.length === 0) {

            itemsContainer.innerHTML =
                `<p class="text-secondary">
            Your cart is empty.
        </p>`;

        } else {

            itemsContainer.innerHTML = "";

            cart.forEach(item => {

                total += item.price * item.quantity;

                itemsContainer.innerHTML += `

            <div class="d-flex justify-content-between mb-3">

                <div>

                    <strong>
                        ${item.name}
                    </strong>

                    <br>

                    <small class="text-secondary">
                        ${item.restaurant}
                    </small>

                    <br>

                    <small>
                        Qty: ${item.quantity}
                    </small>

                </div>

                <strong>
                    ₹${item.price * item.quantity}
                </strong>

            </div>

        `;

            });

        }

        document.getElementById("checkoutTotal").innerText =
            "₹" + total;




    </script>

</body>

</html>
